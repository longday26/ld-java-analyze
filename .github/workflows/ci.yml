name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      - name: Build language server
        run: cargo build -p ld-java-analyze

      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: TypeScript typecheck
        working-directory: editors/vscode
        run: npm run typecheck
      - name: Bundle server into extension
        run: |
          mkdir -p editors/vscode/server
          cp target/debug/ld-java-analyze editors/vscode/server/ld-java-analyze
      - name: Package VSIX
        working-directory: editors/vscode
        run: npm run vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: ld-java-analyze-vsix-linux
          path: editors/vscode/*.vsix
